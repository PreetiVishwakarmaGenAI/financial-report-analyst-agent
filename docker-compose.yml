services:
  financial-analyst-agent:
    image: financial-analyst-agent:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: financial-analyst-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s